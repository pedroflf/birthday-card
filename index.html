<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Happy Birthday, Bella! 🎂✨</title>

  <!-- Make it feel like an app on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 50% -20%, #ffeaf6, #fff), #fff;
      color: #222;
      overflow: hidden;
    }

    .wrap {
      position: relative;
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92vw, 640px);
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      transform: translateY(10px);
      opacity: 0;
      animation: rise 900ms ease-out forwards 300ms;
    }
    @keyframes rise { to { transform: translateY(0); opacity: 1; } }

    h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 8px 0; }
    .subtitle { font-size: clamp(16px, 3.6vw, 18px); opacity: 0.8; margin-bottom: 18px; }

    .hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      background: #00000010;
      overflow: hidden;
      margin: 10px 0 18px;
      position: relative;
    }

    /* Slideshow */
    .slides { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .slides img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transform: scale(1.02); transition: opacity .6s ease, transform .6s ease;
    }
    .slides img.active { opacity: 1; transform: scale(1); }

    .lock { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 6px; }
    .code {
      border: 1px solid #ddd; border-radius: 999px; padding: 12px 16px; font-size: 16px;
      outline: none; transition: box-shadow .2s ease, border-color .2s ease;
    }
    .code:focus { box-shadow: 0 0 0 3px rgba(0,0,0,0.06); border-color: #bbb; }

    .btn {
      display: inline-block;
      border: none; border-radius: 999px; padding: 14px 20px; font-size: 16px; cursor: pointer;
      background: #111; color: #fff; transition: transform .06s ease, box-shadow .2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }
    .btn:active { transform: translateY(1px) scale(0.99); }

    .note { margin-top: 14px; font-size: 14px; opacity: 0.75; }

    .secret {
      margin-top: 14px; font-size: 17px; line-height: 1.5;
      display: none; opacity: 0; transform: translateY(6px);
    }
    .secret.show { display: block; animation: reveal .5s ease forwards; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .footer { position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 0; right: 0;
      text-align: center; font-size: 12px; opacity: 0.6; padding: 10px; }

    /* Fireworks canvas (optional future upgrade) */
    #fireworks { position: fixed; inset: 0; pointer-events: none; display: none; }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="wrap">
    <div class="card">
      <h1>Happy Birthday, Bella! 🎂💫</h1>
      <div class="subtitle">A little surprise from me to you.</div>

      <!-- Slideshow -->
      <div class="hero">
        <div class="slides" id="slides">
          <!-- Replace these with your files (details below) -->
          <img src="photos/1.jpg" alt="Us 1">
          <img src="photos/2.jpg" alt="Us 2">
          <img src="photos/3.jpg" alt="Us 3">
        </div>
      </div>

      <!-- Secret unlock -->
      <div class="lock">
        <input id="code" class="code" placeholder="Type our secret word…" autocomplete="off" />
        <button id="unlock" class="btn">Unlock ✨</button>
      </div>

      <!-- Hidden message -->
      <div id="secret" class="secret">
        <p>Every day with you is my favorite adventure. When we look at the moon, we’re under the same sky—“something.” 🌙</p>
        <p>More waves, more laughs, more us. 💙</p>
      </div>

      <div class="note">Tip: Add this to your Home Screen for a cute app icon.</div>
    </div>
  </div>

  <div class="footer">Made with 💛 by Pedro</div>

  <!-- Your audio file. Put it in /audio and name as you like. It starts when she unlocks. -->
  <audio id="bgm" src="audio/song.mp3" preload="auto"></audio>

  <script>
    // ===================== Confetti =====================
    (function() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      let W, H, pieces;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function random(min, max) { return Math.random() * (max - min) + min; }

      function createPieces(n=180) {
        pieces = new Array(n).fill().map(()=>({
          x: random(0, W),
          y: random(-H, 0),
          r: random(4, 10),
          d: random(1, 3),
          tilt: random(-10, 10),
          tiltAngle: 0,
          tiltAngleInc: random(0.01, 0.03)
        }));
      }
      createPieces();

      function draw() {
        ctx.clearRect(0,0,W,H);
        pieces.forEach(p => {
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.tilt * Math.PI/180, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${(p.x + p.y) % 360}, 80%, 60%)`;
          ctx.fill();
        });
        update();
        requestAnimationFrame(draw);
      }

      function update() {
        pieces.forEach(p=>{
          p.tiltAngle += p.tiltAngleInc;
          p.y += (Math.cos(p.tiltAngle) + p.d + 0.5) * 0.8;
          p.x += Math.sin(p.tiltAngle);
          if (p.y > H + 10) { p.y = -10; p.x = Math.random()*W; }
        });
      }
      draw();

      // ======= Unlock logic (password + vibration + audio + reveal) =======
      const secret = document.getElementById('secret');
      const input = document.getElementById('code');
      const unlock = document.getElementById('unlock');
      const audio = document.getElementById('bgm');
      const SECRET = 'something'; // <-- your secret word

      function vibrate(pat=30) { if (navigator.vibrate) try { navigator.vibrate(pat); } catch(e){} }

      function burst() {
        // add extra confetti briefly
        const extra = new Array(220).fill().map(()=>({
          x: W/2, y: H/3, r: Math.random()*5+3, d: Math.random()*2+1,
          tilt: Math.random()*20-10, tiltAngle: 0, tiltAngleInc: Math.random()*0.03+0.02
        }));
        pieces.push(...extra);
        setTimeout(()=> pieces.splice(-extra.length, extra.length), 1500);
      }

      async function playAudio() {
        if (!audio) return;
        try {
          audio.volume = 0; // fade in
          await audio.play();
          let v = 0;
          const fade = setInterval(()=>{
            v += 0.05;
            audio.volume = Math.min(1, v);
            if (v >= 1) clearInterval(fade);
          }, 80);
        } catch (e) {
          // iOS may block autoplay until tap: we are already in a click handler, so it should work.
        }
      }

      unlock.addEventListener('click', async () => {
        const val = (input.value || '').trim().toLowerCase();
        if (val === SECRET) {
          vibrate(20);
          burst();
          secret.classList.add('show');
          document.querySelector('.lock').style.display = 'none';
          await playAudio();
        } else {
          vibrate([20,40,20]);
          input.value = '';
          input.placeholder = 'Try again ♥';
        }
      });

      // ======= Slideshow (autoplay + swipe) =======
      const slides = Array.from(document.querySelectorAll('#slides img'));
      let idx = 0;
      function show(i){
        slides.forEach((img, n)=> img.classList.toggle('active', n===i));
      }
      if (slides.length) {
        show(0);
        let auto = setInterval(()=>{ idx = (idx+1)%slides.length; show(idx); }, 3500);

        // touch swipe
        let startX = 0, dx = 0;
        const el = document.getElementById('slides');
        el.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; dx=0; clearInterval(auto); }, {passive:true});
        el.addEventListener('touchmove', e=>{ dx = e.touches[0].clientX - startX; }, {passive:true});
        el.addEventListener('touchend', ()=>{
          if (Math.abs(dx) > 40) { idx = (dx < 0) ? (idx+1)%slides.length : (idx-1+slides.length)%slides.length; show(idx); }
          auto = setInterval(()=>{ idx = (idx+1)%slides.length; show(idx); }, 3500);
        }, {passive:true});
      }
    })();
  </script>
</body>
</html>
